name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        id: compilar
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk GermanySolar.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GermanySolar-apk
          path: GermanySolar.apk

      - name: Publicar na página de versões
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao GermanySolar.apk \
            --title "Germany Solar - versão 1.0.${{ github.run_number }}" \
            --notes "Baixe o arquivo GermanySolar.apk abaixo e abra no celular para instalar."

      - name: Guardar resultado no ramo apk
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/saida
          echo "${{ steps.compilar.outcome }} ${{ github.sha }} run=${{ github.run_number }}" > /tmp/saida/status.txt
          [ -f build.log ] && tail -n 400 build.log > /tmp/saida/build.log || true
          [ -f GermanySolar.apk ] && cp GermanySolar.apk /tmp/saida/ || true
          cd /tmp/saida
          git init -q -b apk
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Resultado da compilação ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" apk
