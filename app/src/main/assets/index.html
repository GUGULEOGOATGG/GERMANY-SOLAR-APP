<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Germany Solar</title>
<link rel="icon" type="image/png" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plano: azul escuro no cabeçalho com sol laranja claro; laranja fosco só nas ações e no progresso.
   Coluna única de até 920px; abas no topo (desktop) ou no rodapé (celular). */
:root{
  --bg:#f1f3f8; --surface:#ffffff; --ink:#14233b; --muted:#59677f; --line:#d4dae6;
  --brand:#17305a; --primary:#1d3d70; --on-primary:#ffffff;
  --accent:#b4601f; --on-accent:#ffffff; --sun:#f8ab4e;
  --ok:#1f7a4d; --ok-bg:#e1f1e8; --warn:#8f5600; --warn-bg:#fbe9cc;
  --bad:#b3261e; --bad-bg:#f9e0de; --info:#1d4f8f; --info-bg:#dfe8f6; --off:#667186; --off-bg:#e6e9f0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1728; --surface:#15233b; --ink:#e6ebf4; --muted:#93a1b8; --line:#273752;
    --brand:#0a1322; --primary:#3a67aa; --on-primary:#ffffff;
    --accent:#d98845; --on-accent:#221200; --sun:#f8ab4e;
    --ok:#6fd3a0; --ok-bg:#16382a; --warn:#f0c064; --warn-bg:#3d2f10;
    --bad:#ff9d94; --bad-bg:#45201d; --info:#9cc2f2; --info-bg:#1a3357; --off:#a3adbf; --off-bg:#243350;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1728; --surface:#15233b; --ink:#e6ebf4; --muted:#93a1b8; --line:#273752;
  --brand:#0a1322; --primary:#3a67aa; --on-primary:#ffffff;
  --accent:#d98845; --on-accent:#221200; --sun:#f8ab4e;
  --ok:#6fd3a0; --ok-bg:#16382a; --warn:#f0c064; --warn-bg:#3d2f10;
  --bad:#ff9d94; --bad-bg:#45201d; --info:#9cc2f2; --info-bg:#1a3357; --off:#a3adbf; --off-bg:#243350;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);padding-bottom:88px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{background:var(--brand);border-bottom:4px solid var(--accent)}
.bar{max-width:920px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font:700 26px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:#fff;display:flex;align-items:center;gap:12px}
.sol{width:44px;height:44px;color:var(--sun);flex:none}
.brand small{display:block;font:500 13px/1.3 var(--body);color:rgba(255,255,255,.72);text-transform:none;letter-spacing:0;margin-top:3px}
nav{display:flex;gap:4px;margin-left:auto}
nav a{font:600 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;text-decoration:none;color:rgba(255,255,255,.72);padding:10px 14px;border-radius:6px;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:#fff;border-bottom-color:var(--sun);border-radius:6px 6px 0 0}
nav a:hover{color:#fff}

main{max-width:920px;margin:0 auto;padding:20px 16px;display:grid;gap:20px}
.notice{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:34px;line-height:1.05}
.head p{margin:4px 0 0;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=tel],input[type=date],input[type=number],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:80px;resize:vertical}
.search{max-width:280px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tiles.quatro{grid-template-columns:repeat(4,1fr)}
.tile.din b{font-size:26px;line-height:1.15}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.din,.valor{font-variant-numeric:tabular-nums;white-space:nowrap}
.valor{font:700 22px/1.1 var(--display)}
.resumo{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;padding:8px 10px;background:var(--bg);border-radius:8px}
.resumo b{font-variant-numeric:tabular-nums}
.foto-prev{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);display:block}
.foto-grande{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.oque .obs{font-style:italic}
.oque .receb{color:var(--ok);font-weight:600;font-style:normal}
form[data-tipo="entrada"] .so-saida,form[data-tipo="saida"] .so-entrada{display:none}
form:not([data-outro="1"]) .so-outro{display:none}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile b{display:block;font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:14px}

section>h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;grid-template-columns:1fr auto;align-items:start}
.row.dim{opacity:.6}
.row h3{font-size:22px;line-height:1.1}
.meta{color:var(--muted);font-size:14px;display:flex;gap:4px 14px;flex-wrap:wrap;overflow-wrap:anywhere}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.pill,.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)}
.bad{background:var(--bad-bg);color:var(--bad)} .info{background:var(--info-bg);color:var(--info)}
.off{background:var(--off-bg);color:var(--off)}
.chip{background:var(--off-bg);color:var(--ink);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 13px;min-height:42px;font-weight:600;font-size:14px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg button.p[aria-pressed="true"]{background:var(--ok);color:var(--surface)}
.seg button.f[aria-pressed="true"]{background:var(--bad);color:var(--surface)}
.seg button.g[aria-pressed="true"]{background:var(--info);color:var(--surface)}
.daynav{display:flex;gap:8px;align-items:center}
.daynav input{width:auto}
.pres{grid-template-columns:1fr auto;align-items:center}

.etapas{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.etapas p{margin:0}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.barra{flex:1;max-width:220px;height:6px;background:var(--off-bg);border-radius:9px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--accent)}
.etapas ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.etapas li{display:grid;grid-template-columns:auto 52px 1fr auto;gap:10px;align-items:start;padding:8px 10px;background:var(--bg);border-radius:8px}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);color:transparent;cursor:pointer;font-weight:700;padding:0;line-height:1}
li.feito .check{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check:disabled{cursor:default}
.quando{font:600 18px/30px var(--display);font-variant-numeric:tabular-nums}
.oque{overflow-wrap:anywhere;padding-top:3px}
.oque small{display:block;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 2px;text-decoration:underline;justify-self:start}
.dur{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dur label{display:flex;gap:10px;align-items:center;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer}
.dur label:has(input:checked){border-color:var(--accent)}
.dur input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.dur small{display:block}
form[data-dur="curto"] .so-longo,form[data-dur="longo"] .so-curto{display:none}
.grupo{display:grid;gap:10px}
.grupo>h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,16,20,.55)}
dialog form{padding:20px;display:grid;gap:14px}
dialog h2{font-size:28px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:5px;font-size:14px;font-weight:600}
label small{font-weight:400;color:var(--muted)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;align-items:center;gap:8px;font-weight:500;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.foot .danger{margin-right:auto}
.err{color:var(--bad);font-weight:600;margin:0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100vw - 32px);z-index:5}
#toast:empty{display:none}

@media (max-width:640px){
  .bar{padding:12px 16px}
  nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--brand);border-top:3px solid var(--accent);justify-content:space-around;padding:6px 8px;z-index:4}
  nav a{font-size:15px;padding:12px 2px;flex:1;text-align:center;border-bottom:0;border-top:3px solid transparent}
  nav a[aria-current="page"]{border-top-color:var(--sun);border-radius:0}
  .head h1{font-size:28px}
  .tile b{font-size:36px}.tile{padding:12px}
  .tiles.quatro{grid-template-columns:repeat(2,1fr)}
  .tile.din b{font-size:22px}
  .grid2,.checks,.dur{grid-template-columns:1fr}
  .etapas li{grid-template-columns:auto 46px 1fr}
  .etapas li .link{grid-column:3}
  .search{max-width:none}
  .pres{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg class="sol" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="10" fill="currentColor"/><g stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M24 3v5M24 40v5M3 24h5M40 24h5M12.7 12.7 9.2 9.2M35.3 12.7l3.5-3.5M12.7 35.3l-3.5 3.5M35.3 35.3l3.5 3.5"/></g></svg>
      <div>Germany Solar<small>Funcionários, serviços e presença</small></div>
    </div>
    <nav aria-label="Seções">
      <a href="#inicio">Início</a>
      <a href="#equipe">Equipe</a>
      <a href="#servicos">Serviços</a>
      <a href="#presenca">Presença</a>
      <a href="#financas">Finanças</a>
    </nav>
  </div>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
const FUNCOES = ["Eletricista","Instalador solar","Ajudante","Técnico em eletrotécnica","Engenheiro eletricista","Projetista","Administrativo"];
const ST_FUNC = {ativo:["Ativo","ok"],ferias:["Férias","info"],afastado:["Afastado","warn"],desligado:["Desligado","off"]};
const TIPOS = ["Instalação solar","Manutenção solar","Limpeza de módulos","Elétrica residencial","Elétrica predial","Elétrica industrial","Vistoria técnica"];
const ST_SERV = {agendado:["Agendado","info"],andamento:["Em andamento","warn"],concluido:["Concluído","ok"]};
const PRES = {presente:"Presente",falta:"Falta",folga:"Folga"};
const FORMAS = ["Pix","Dinheiro","Cartão de crédito","Cartão de débito","Transferência","Boleto","Cheque"];
const CAT_ENT = ["Pagamento do cliente","Sinal / entrada","Outro recebimento"];
const CAT_SAI = ["Pagamento de funcionário","Material e equipamentos","Combustível e transporte","Ferramentas","Alimentação","Impostos e taxas","Outra despesa"];
const PAG = {dia:"Por dia",semana:"Por semana",mes:"Mensal",servico:"Por serviço"};
const PAG_SUF = {dia:"por dia",semana:"por semana",mes:"por mês",servico:"por serviço"};
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const hoje = () => iso(new Date());
const br = s => s ? s.split("-").reverse().join("/") : "";
const dias = s => Math.round((new Date(s+"T00:00") - new Date(hoje()+"T00:00")) / 864e5);
const brl = n => (Number(n) || 0).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const num = t => { let x = String(t ?? "").replace(/[R$\s]/g, ""); if(x.includes(",")) x = x.replace(/\./g, "").replace(",", "."); const n = parseFloat(x); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const valIn = n => num(n) ? num(n).toFixed(2).replace(".", ",") : "";
const r2 = n => Math.round(n * 100) / 100;
const nomeMes = m => { const [a,b] = m.split("-"); return MESES[Number(b) - 1] + " de " + a; };
const somaMes = (m,n) => { const d = new Date(m + "-15T12:00"); d.setMonth(d.getMonth() + n); return iso(d).slice(0,7); };
const somaDia = (s,n) => { const d = new Date(s+"T12:00"); d.setDate(d.getDate()+n); return iso(d); };

const S = {
  db:null, conn:"conectando", podeEscrever:true,
  func:[], serv:[], okFunc:false, okServ:false,
  busca:"", filtroServ:"abertos",
  abertos:new Set(),
  lanc:[], okLanc:false, mes:hoje().slice(0,7), presMes:{}, fotoForm:undefined,
  modo:"local", cfg:null, user:null, login:false, unsubs:[],
  presData:hoje(), marcas:{}, presSujo:false, presGravando:false, presUnsub:null
};

/* ---------- banco de dados local ---------- */
const NO_APP = location.protocol.startsWith("http") && location.hostname === "127.0.0.1";
const ANDROID = !!(window.AndroidApp && window.AndroidApp.lerDados);
const COLS = ["funcionarios","servicos","presenca","lancamentos","fotos"];
const CFG_K = "equipe-nuvem-config";

/* Banco local: arquivo ao lado do programa (app de PC) ou armazenamento do navegador. */
async function bancoLocal(){
  const K = "equipe-eletrica-solar-v1";
  let dados;
  if(ANDROID){
    dados = JSON.parse(window.AndroidApp.lerDados() || "{}") || {};
  } else if(NO_APP){
    const r = await fetch("/api/dados", {cache:"no-store"});
    if(!r.ok) throw 0;
    dados = await r.json() || {};
  } else dados = JSON.parse(localStorage.getItem(K) || "{}") || {};
  const subs = [], meta = {fromCache:false, hasPendingWrites:false};
  let fila = Promise.resolve();
  const grava = () => {
    subs.slice().forEach(f => f());
    const corpo = JSON.stringify(dados);
    if(ANDROID) return window.AndroidApp.gravarDados(corpo) ? Promise.resolve() : Promise.reject({code:"disco"});
    if(!NO_APP){
      try { localStorage.setItem(K, corpo); return Promise.resolve(); } catch(e){ return Promise.reject({code:"quota_exceeded"}); }
    }
    fila = fila.catch(() => {}).then(() => fetch("/api/dados", {method:"PUT", headers:{"Content-Type":"application/json","X-App":"1"}, body:corpo}))
      .then(r => { if(!r.ok) throw {code:"unavailable"}; });
    return fila;
  };
  const snap = (c,id) => ({id, exists:!!(dados[c] && dados[c][id]), data:() => dados[c] && dados[c][id], metadata:meta});
  const ouvir = f => { subs.push(f); setTimeout(f, 0); return () => { const i = subs.indexOf(f); if(i >= 0) subs.splice(i,1); }; };
  const docRef = (c,id) => ({id, path:c + "/" + id,
    async set(d){ (dados[c] = dados[c] || {})[id] = d; await grava(); },
    async update(d){ if(!dados[c] || !dados[c][id]) throw {code:"invalid_argument"}; dados[c][id] = {...dados[c][id], ...d}; await grava(); },
    async delete(){ if(dados[c]) delete dados[c][id]; await grava(); },
    async get(){ return snap(c,id); },
    onSnapshot(next){ return ouvir(() => next(snap(c,id))); }});
  return {
    doc:p => { const [c,id] = p.split("/"); return docRef(c,id); },
    collection:c => ({doc:id => docRef(c, id || novoId()),
      onSnapshot(next){ return ouvir(() => next({docs:Object.keys(dados[c] || {}).map(id => snap(c,id)), metadata:meta})); }}),
    vazio:() => !COLS.some(c => Object.keys(dados[c] || {}).length),
    exportar:() => JSON.stringify(dados, null, 1),
    importar:o => { dados = o; return grava(); }
  };
}

/* Banco na nuvem: Firestore do projeto Firebase do próprio usuário. */
function lerCfg(){ try { return JSON.parse(localStorage.getItem(CFG_K)); } catch(e){ return null; } }
function carregarScript(src){
  return new Promise((ok, er) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = er; document.head.appendChild(el); });
}
async function carregarFirebase(cfg){
  const v = "https://www.gstatic.com/firebasejs/10.12.2/firebase-";
  await carregarScript(v + "app-compat.js");
  await carregarScript(v + "auth-compat.js");
  await carregarScript(v + "firestore-compat.js");
  firebase.initializeApp(cfg);
  try { await firebase.firestore().enablePersistence({synchronizeTabs:true}); } catch(e){}
}
function bancoNuvem(){
  const fs = firebase.firestore();
  const limpo = d => JSON.parse(JSON.stringify(d));
  // Sem internet a gravação fica na fila do aparelho: libera a tela depois de 4 s.
  const prazo = p => {
    let venceu = false;
    p.catch(e => { if(venceu) aviso(msgErro(e)); });
    return Promise.race([p, new Promise(r => setTimeout(() => { venceu = true; r(); }, 4000))]);
  };
  const docRef = r => ({id:r.id, path:r.path,
    set:d => prazo(r.set(limpo(d))), update:d => prazo(r.update(limpo(d))), delete:() => prazo(r.delete()),
    get:() => r.get().then(x => ({id:x.id, exists:x.exists, data:() => x.data()})),
    onSnapshot:(n,e) => r.onSnapshot(n,e)});
  return {
    doc:p => docRef(fs.doc(p)),
    collection:c => ({doc:id => docRef(id ? fs.collection(c).doc(id) : fs.collection(c).doc()),
      onSnapshot:(n,e) => fs.collection(c).onSnapshot(n,e)}),
    async exportar(){
      const o = {};
      for(const c of COLS){ const q = await fs.collection(c).get(); o[c] = {}; q.docs.forEach(d => { o[c][d.id] = d.data(); }); }
      return JSON.stringify(o, null, 1);
    },
    async importar(o){
      const ops = [];
      for(const c of COLS) for(const [id,d] of Object.entries(o[c] || {})) ops.push([fs.collection(c).doc(id), limpo(d)]);
      for(let i = 0; i < ops.length; i += 400){
        const b = fs.batch(); ops.slice(i, i + 400).forEach(([r,d]) => b.set(r,d)); await b.commit();
      }
    }
  };
}

async function iniciar(){

    S.modo = "nuvem";
    try { await carregarFirebase(S.cfg); } catch(e){ S.conn = "semnet"; render(); return; }
    firebase.auth().onAuthStateChanged(u => {

      S.user = u.email; S.login = false; S.db = bancoNuvem(); ouvir();

function pararOuvintes(){
  S.unsubs.forEach(f => f()); S.unsubs = [];
  if(S.presUnsub){ S.presUnsub(); S.presUnsub = null; }
  S.db = null; S.func = []; S.serv = []; S.lanc = []; S.presMes = {}; S.okFunc = S.okServ = S.okLanc = false; S.marcas = {}; S.conn = "conectando";
}
function ouvir(){
  const db = S.db;
  const lento = setTimeout(() => { if(S.conn === "conectando"){ S.conn = "lento"; render(); } }, 10000);
  const pronto = snap => { if(!snap.metadata.fromCache){ clearTimeout(lento); S.conn = "ok"; } };
  const falha = e => { clearTimeout(lento); S.conn = e && e.code === "permission-denied" ? "perm" : "erro"; render(); };
  S.unsubs.push(db.collection("funcionarios").onSnapshot(snap => {
    S.func = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => String(a.nome).localeCompare(String(b.nome),"pt-BR"));
    S.okFunc = true; pronto(snap); render();
  }, falha));
  S.unsubs.push(db.collection("servicos").onSnapshot(snap => {
    S.serv = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => String(a.data).localeCompare(String(b.data)));
    S.okServ = true; pronto(snap); render();
  }, falha));
  S.unsubs.push(db.collection("lancamentos").onSnapshot(snap => {
    S.lanc = snap.docs.map(d => ({id:d.id, ...d.data()}));
    S.okLanc = true; pronto(snap); render();
  }, falha));
  ouvirPresenca();
  render();
}
function ouvirPresenca(){
  if(!S.db) return;
  if(S.presUnsub) S.presUnsub();
  S.marcas = {}; S.presSujo = false;
  const data = S.presData;
  S.presUnsub = S.db.doc("presenca/" + data).onSnapshot(snap => {
    if(data !== S.presData || S.presSujo || S.presGravando) return;
    const d = snap.exists ? snap.data() : null;
    S.marcas = {...((d && d.marcas) || {})};
    if(rota() === "presenca") render();
  }, () => {});
}
async function gravarPresenca(){
  if(S.presGravando) return;
  S.presGravando = true;
  try {
    while(S.presSujo){
      S.presSujo = false;
      await S.db.doc("presenca/" + S.presData).set({marcas:{...S.marcas}});
      delete S.presMes[S.presData.slice(0,7)];
    }
  } catch(e){ aviso(msgErro(e)); }
  S.presGravando = false;
}
function msgErro(e){
  const c = e && e.code;
  if(c === "permission-denied") return "A nuvem recusou a gravação. Confira as regras do Firestore no passo a passo.";
  if(c === "disco") return "Não foi possível gravar no celular. Verifique se há espaço livre.";
  if(c === "invalid_argument") return "Não foi possível salvar. Sua conta pode estar só com permissão de leitura.";
  if(c === "quota_exceeded") return "O armazenamento do navegador está cheio. Baixe um backup e apague registros antigos.";
  if(c === "resource_exhausted") return "Muitas alterações seguidas. Aguarde alguns segundos e tente de novo.";
  if(c === "revoked") return "Seu acesso mudou. Recarregue a página.";
  return "Não foi possível salvar. Feche e abra o app de novo.";
}

function recebEtapas(){
  const out = [];
  for(const s of S.serv) for(const e of s.etapas || []) if(num(e.recebido) > 0)
    out.push({id:"etapa-" + e.id, etapa:true, eid:e.id, tipo:"entrada", data:e.data, valor:num(e.recebido), forma:e.forma || "",
      categoria:"Recebido na etapa", descricao:e.texto, servicoId:s.id});
  return out;
}
const todosLanc = () => S.lanc.concat(recebEtapas());
const soma = (arr) => r2(arr.reduce((a,l) => a + num(l.valor), 0));
function finServico(s){
  const ls = todosLanc().filter(l => l.servicoId === s.id).sort((a,b) => String(b.data).localeCompare(String(a.data)));
  const rec = soma(ls.filter(l => l.tipo === "entrada")), gas = soma(ls.filter(l => l.tipo === "saida"));
  const valor = num(s.valor);
  return {ls, rec, gas, valor, falta:Math.max(0, r2(valor - rec))};
}
const participou = (s,fid) => (s.equipe || []).includes(fid) || (s.etapas || []).some(e => (e.equipe || []).includes(fid));
function semanaDe(d){ const x = new Date(d + "T12:00"); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return iso(x); }
function carregarPresMes(m){
  if(S.presMes[m] || !S.db) return;
  S.presMes[m] = {carregando:true};
  const [a,b] = m.split("-").map(Number), n = new Date(a, b, 0).getDate();
  const dias = Array.from({length:n}, (_,i) => m + "-" + String(i + 1).padStart(2, "0"));
  Promise.all(dias.map(d => S.db.doc("presenca/" + d).get().then(x => [d, x.exists ? ((x.data() || {}).marcas || {}) : null]).catch(() => [d, null])))
    .then(r => { const o = {}; r.forEach(([d,mk]) => { if(mk) o[d] = mk; }); S.presMes[m] = {dias:o}; if(rota() === "financas") render(); });
}
function folha(m){
  const pres = (S.presMes[m] || {}).dias || {};
  return S.func.filter(f => f.pagTipo && num(f.pagValor) > 0).map(f => {
    const dias = new Set();
    for(const [d,mk] of Object.entries(pres)) if(mk[f.id] === "presente") dias.add(d);
    for(const s of S.serv){
      if(longo(s)){ for(const e of s.etapas || []) if(String(e.data).startsWith(m) && e.feito && (e.equipe || []).includes(f.id)) dias.add(e.data); }
      else if(String(s.data).startsWith(m) && s.status === "concluido" && (s.equipe || []).includes(f.id)) dias.add(s.data);
    }
    const v = num(f.pagValor), pl = (n,a,b) => n + " " + (n === 1 ? a : b);
    let qtd = 0, base = "";
    if(f.pagTipo === "dia"){ qtd = dias.size; base = `${pl(qtd,"dia trabalhado","dias trabalhados")} × ${brl(v)}`; }
    else if(f.pagTipo === "semana"){ qtd = new Set([...dias].map(semanaDe)).size; base = `${pl(qtd,"semana com trabalho","semanas com trabalho")} × ${brl(v)}`; }
    else if(f.pagTipo === "mes"){ qtd = f.status !== "desligado" || dias.size ? 1 : 0; base = qtd ? `Salário mensal de ${brl(v)}` : "Desligado, sem dias trabalhados no mês"; }
    else {
      qtd = S.serv.filter(s => s.status === "concluido" && String(s.concluidoEm || s.dataFim || s.data).startsWith(m) && participou(s, f.id)).length;
      base = `${pl(qtd,"serviço concluído","serviços concluídos")} × ${brl(v)}`;
    }
    const devido = r2(qtd * v);
    const pago = soma(S.lanc.filter(l => l.tipo === "saida" && l.funcionarioId === f.id && String(l.data).startsWith(m)));
    return {f, base, devido, pago, falta:r2(devido - pago)};
  }).filter(x => x.devido > 0 || x.pago > 0);
}

async function comprimirFoto(arq){
  const url = URL.createObjectURL(arq);
  try {
    const img = await new Promise((ok, er) => { const i = new Image(); i.onload = () => ok(i); i.onerror = er; i.src = url; });
    const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.6);
  } finally { URL.revokeObjectURL(url); }
}

    abrir(`<form id="form-foto"><h2>Recibo</h2><img class="foto-grande" alt="Foto do recibo" src="${esc(img)}">

function telaInicio(){
  const h = hoje();
  const ativos = S.func.filter(f => f.status === "ativo").length;
  const deHoje = S.serv.filter(s => s.status !== "concluido" && (longo(s) ? s.data <= h : s.data === h));
  const andamento = S.serv.filter(s => s.status === "andamento").length;
  const atrasados = S.serv.filter(s => !longo(s) && s.data < h && s.status === "agendado");
  const al = alertasNR();
  const fora = S.func.filter(f => f.status === "ferias" || f.status === "afastado");
  const dataTxt = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  let h2 = `<div class="head"><div><h1>Hoje</h1><p>${esc(dataTxt)}</p></div></div>

  if(atrasados.length) h2 += `<section><h2>Agendados com data vencida</h2><div class="list">${atrasados.map(cardServico).join("")}</div></section>`;
  if(al.length || fora.length){

      <div class="checks" style="margin-top:6px">${pessoas.length ? pessoas.map(f =>
        `<label><input type="checkbox" id="eq-${esc(f.id)}" value="${esc(f.id)}" ${eq.includes(f.id) ? "checked" : ""}>${esc(f.nome)}</label>`).join("")
        : `<span class="meta">Cadastre funcionários ativos para montar a equipe.</span>`}</div></div>
    <label>Observações<textarea id="s-obs" maxlength="500">${esc(s.obs)}</textarea></label>
    <p class="meta so-longo" style="margin:0">Depois de salvar, use o botão Registrar etapa de hoje no cartão do serviço para anotar o que foi feito em cada dia.</p>
    <p class="err" id="erro" hidden></p>
    <div class="foot">
      ${id ? `<button type="button" class="btn danger" data-excluir="servicos/${esc(id)}" data-nome="${esc(s.cliente)}">Excluir</button>` : ""}
      <button type="button" class="btn" data-fechar>Cancelar</button>
      <button class="btn primary" id="salvar">Salvar</button>
    </div></form>`);
}
function formEtapa(sid, eid){
  const s = S.serv.find(x => x.id === sid); if(!s) return;
  const e = (s.etapas || []).find(x => x.id === eid) || {data:hoje(), equipe:s.equipe || [], feito:true, texto:""};
  const eq = e.equipe || [];
  const pessoas = S.func.filter(f => f.status === "ativo" || eq.includes(f.id));
  abrir(`<form id="form-etapa" data-sid="${esc(sid)}" data-eid="${esc(eid || "")}">
    <h2>${eid ? "Editar etapa" : "Registrar etapa"}</h2>
    <p class="meta" style="margin:0">${esc(s.cliente)} · ${esc(s.tipo)}</p>
    <label>Dia<input type="date" id="e-data" required value="${esc(e.data)}"></label>
    <label>O que foi feito neste dia<textarea id="e-texto" required maxlength="400" placeholder="Ex.: fixação dos trilhos e passagem dos cabos CC">${esc(e.texto)}</textarea></label>
    <div><label>Funcionários desta etapa</label>
      <div class="checks" style="margin-top:6px">${pessoas.length ? pessoas.map(f =>
        `<label><input type="checkbox" id="ee-${esc(f.id)}" value="${esc(f.id)}" ${eq.includes(f.id) ? "checked" : ""}>${esc(f.nome)}</label>`).join("")
        : `<span class="meta">Nenhum funcionário ativo cadastrado.</span>`}</div></div>
    <label>Observações da etapa<textarea id="e-obs" maxlength="500" placeholder="Ex.: faltou material, cliente pediu mudança no local do inversor">${esc(e.obs)}</textarea></label>
    <div class="grid2">
      <label>Recebeu algum valor nesta etapa? <small>deixe em branco se não recebeu</small><input type="text" inputmode="decimal" id="e-receb" placeholder="0,00" value="${esc(valIn(e.recebido))}"></label>
      <label>Forma de recebimento<select id="e-forma">${opts(FORMAS, e.forma || "Pix")}</select></label>
    </div>
    <p class="meta" style="margin:0">Para guardar a foto do recibo, use o botão Financeiro e recibos no cartão do serviço.</p>
    <div class="checks" style="grid-template-columns:1fr"><label><input type="checkbox" id="e-feito" ${e.feito ? "checked" : ""}>Etapa concluída <small>desmarque se for só planejada ou ficou pendente</small></label></div>
    <p class="err" id="erro" hidden></p>
    <div class="foot">
      ${eid ? `<button type="button" class="btn danger" data-excluir-etapa>Excluir etapa</button>` : ""}
      <button type="button" class="btn" data-fechar>Cancelar</button>
      <button class="btn primary" id="salvar">Salvar</button>
    </div></form>`);
}
function gravarEtapas(sid, etapas, extra){
  return S.db.doc("servicos/" + sid).update({etapas, ...(extra || {})});
}
function abrir(html){ const d = $("#dlg"); d.innerHTML = html; if(!d.open) d.showModal(); }
function fechar(){ const d = $("#dlg"); if(d.open) d.close(); d.innerHTML = ""; }
function erroForm(e){ const p = $("#erro"); if(p){ p.textContent = msgErro(e); p.hidden = false; } const b = $("#salvar"); if(b) b.disabled = false; }
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };

async function salvar(col, id, dados){
  $("#salvar").disabled = true;
  try {
    const ref = id ? S.db.doc(col + "/" + id) : S.db.collection(col).doc();
    await ref.set(dados);
    fechar(); aviso("Salvo.");
  } catch(e){ erroForm(e); }
}

document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target;
  if(f.id === "form-func"){
    const id = f.dataset.id, antigo = S.func.find(x => x.id === id);
    salvar("funcionarios", id, {nome:val("f-nome"), funcao:val("f-funcao"), status:val("f-status"), telefone:val("f-telefone"),
      admissao:val("f-admissao"), nr10:val("f-nr10"), nr35:val("f-nr35"), obs:val("f-obs"),
      pagTipo:val("f-pagtipo"), pagValor:num(val("f-pagvalor")),
      criadoEm:(antigo && antigo.criadoEm) || new Date().toISOString()});
  } else if(f.id === "form-serv"){
    const id = f.dataset.id, antigo = S.serv.find(x => x.id === id);
    const equipe = [...f.querySelectorAll(".checks input:checked")].map(i => i.value);
    const dur = f.dataset.dur === "longo" ? "longo" : "curto";
    const tipo = val("s-tipo") === "Outro" ? (val("s-tipo-outro") || "Outro") : val("s-tipo");
    const st = val("s-status");
    salvar("servicos", id, {cliente:val("s-cliente"), endereco:val("s-endereco"), tipo, data:val("s-data"),
      valor:num(val("s-valor")), concluidoEm:st === "concluido" ? ((antigo && antigo.concluidoEm) || hoje()) : "",
      duracao:dur, dataFim:dur === "longo" ? val("s-fim") : "", etapas:(antigo && antigo.etapas) || [],
      status:st, kwp:val("s-kwp"), equipe, obs:val("s-obs"),
      criadoEm:(antigo && antigo.criadoEm) || new Date().toISOString()});
  } else if(f.id === "form-etapa"){
    const sv = S.serv.find(x => x.id === f.dataset.sid); if(!sv) return fechar();
    const eid = f.dataset.eid;
    const receb = num(val("e-receb"));
    const nova = {id:eid || novoId(), data:val("e-data"), texto:val("e-texto"), feito:$("#e-feito").checked,
      obs:val("e-obs"), recebido:receb, forma:receb > 0 ? val("e-forma") : "",
      equipe:[...f.querySelectorAll('input[id^="ee-"]:checked')].map(i => i.value)};
    const et = (sv.etapas || []).filter(x => x.id !== nova.id).concat(nova);
    $("#salvar").disabled = true;
    gravarEtapas(sv.id, et, sv.status === "agendado" ? {status:"andamento"} : null)
      .then(() => { fechar(); aviso("Etapa salva."); }).catch(erroForm);
  } else if(f.id === "form-lanc"){
    const id = f.dataset.id || novoId(), antigo = S.lanc.find(x => x.id === f.dataset.id);
    const tipo = f.dataset.tipo === "saida" ? "saida" : "entrada", valor = num(val("l-valor"));
    if(!(valor > 0)){ const p = $("#erro"); p.textContent = "Informe um valor maior que zero."; p.hidden = false; return; }
    const foto = S.fotoForm;
    const dados = {tipo, data:val("l-data"), valor, forma:val("l-forma"), categoria:tipo === "entrada" ? val("l-cat-e") : val("l-cat-s"),
      descricao:val("l-desc"), servicoId:val("l-serv"), funcionarioId:tipo === "saida" ? val("l-func") : "",
      temFoto:foto === undefined ? !!(antigo && antigo.temFoto) : !!foto, criadoEm:(antigo && antigo.criadoEm) || new Date().toISOString()};
    $("#salvar").disabled = true;
    (async () => {
      if(foto) await S.db.doc("fotos/" + id).set({img:foto});
      else if(foto === null) await S.db.doc("fotos/" + id).delete();
      await S.db.doc("lancamentos/" + id).set(dados);
    })().then(() => {
      const v = f.dataset.voltar; S.fotoForm = undefined; fechar(); aviso("Lançamento salvo.");
      if(v) setTimeout(() => formFinServ(v), 80);
    }).catch(erroForm);
  } else if(f.id === "form-login"){
    $("#salvar").disabled = true;
    firebase.auth().signInWithEmailAndPassword(val("l-email"), $("#l-senha").value).catch(e => {
      const p = $("#erro"); if(!p) return;
      p.textContent = /network/.test(e.code || "") ? "Sem internet. Confira a conexão e tente de novo." : "E-mail ou senha incorretos.";
      p.hidden = false; $("#salvar").disabled = false;
    });
  } else if(f.id === "form-conectar"){
    const cfg = {};
    for(const m of val("n-cfg").matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g)) cfg[m[1]] = m[2];
    if(!cfg.apiKey || !cfg.projectId){
      const p = $("#erro"); p.textContent = "Não encontrei apiKey e projectId nesse texto. Copie o bloco firebaseConfig inteiro."; p.hidden = false; return;
    }
    localStorage.setItem(CFG_K, JSON.stringify(cfg));
    location.reload();
  } else if(f.id === "form-subir"){
    $("#salvar").disabled = true;
    bancoLocal().then(l => S.db.importar(JSON.parse(l.exportar())))
      .then(() => { fechar(); aviso("Dados enviados para a nuvem."); }).catch(erroForm);
  } else if(f.id === "form-restaurar"){
    $("#salvar").disabled = true;
    S.db.importar(backupPendente).then(() => { backupPendente = null; fechar(); aviso("Backup restaurado."); }).catch(erroForm);
  } else if(f.id === "form-excluir"){
    $("#salvar").disabled = true;
    S.db.doc(f.dataset.path).delete().then(() => { fechar(); aviso("Excluído."); }).catch(erroForm);
  }
});

document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if("novoFunc" in d) formFunc();
  else if(d.func) formFunc(d.func);
  else if("novoServ" in d) formServ();
  else if(d.serv) formServ(d.serv);
  else if("fechar" in d) fechar();
  else if(d.excluir){
    abrir(`<form id="form-excluir" data-path="${esc(d.excluir)}"><h2>Excluir ${esc(d.nome)}?</h2>
      <p style="margin:0">Esta ação não pode ser desfeita. ${d.excluir.startsWith("funcionarios") ? "Para manter o histórico, prefira mudar a situação para Desligado." : ""}</p>
      <p class="err" id="erro" hidden></p>
      <div class="foot"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn primary" id="salvar">Excluir</button></div></form>`);
  }
  else if(d.avancar){
    t.disabled = true;
    S.db.doc("servicos/" + d.avancar).update(d.para === "concluido" ? {status:d.para, concluidoEm:hoje()} : {status:d.para}).catch(e => { aviso(msgErro(e)); t.disabled = false; });
  }
  else if(d.novaEtapa) formEtapa(d.novaEtapa);
  else if(d.etapa) formEtapa(d.sid, d.etapa);
  else if(d.abrir){ S.abertos.has(d.abrir) ? S.abertos.delete(d.abrir) : S.abertos.add(d.abrir); render(); }
  else if(d.feito){
    const sv = S.serv.find(x => x.id === d.sid); if(!sv) return;
    t.disabled = true;
    gravarEtapas(sv.id, (sv.etapas || []).map(e => e.id === d.feito ? {...e, feito:!e.feito} : e))
      .catch(e => { aviso(msgErro(e)); t.disabled = false; });
  }
  else if("excluirEtapa" in d){
    if(!d.conf){ d.conf = "1"; t.textContent = "Clique de novo para excluir"; return; }
    const f = t.closest("form"), sv = S.serv.find(x => x.id === f.dataset.sid); if(!sv) return fechar();
    t.disabled = true;
    gravarEtapas(sv.id, (sv.etapas || []).filter(e => e.id !== f.dataset.eid))
      .then(() => { fechar(); aviso("Etapa excluída."); }).catch(erroForm);
  }
  else if("backup" in d){
    Promise.resolve(S.db.exportar()).then(txt => {
      if(ANDROID){ window.AndroidApp.salvarArquivo("backup-germany-solar-" + hoje() + ".json", txt); return; }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([txt], {type:"application/json"}));
      a.download = "backup-germany-solar-" + hoje() + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      aviso("Backup baixado.");
    }).catch(e => aviso(msgErro(e)));
  }
  else if("conectar" in d){
    abrir(`<form id="form-conectar"><h2>Conectar à nuvem</h2>
      <p style="margin:0">Cole aqui o bloco <b>firebaseConfig</b> que o Firebase mostra ao registrar o app web. O app vai recarregar e pedir o login.</p>
      <label>Configuração do Firebase<textarea id="n-cfg" required style="min-height:170px;font-family:monospace;font-size:13px" placeholder='apiKey: "AIza...",\nauthDomain: "...",\nprojectId: "..."'></textarea></label>
      <p class="err" id="erro" hidden></p>
      <div class="foot"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn primary" id="salvar">Conectar</button></div></form>`);
  }
  else if("subir" in d){
    abrir(`<form id="form-subir"><h2>Enviar dados para a nuvem?</h2>
      <p style="margin:0">Os funcionários, serviços e presenças salvos só neste aparelho serão copiados para a nuvem. Faça isso uma vez, no aparelho que tem os dados.</p>
      <p class="err" id="erro" hidden></p>
      <div class="foot"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn primary" id="salvar">Enviar</button></div></form>`);
  }
  else if("sair" in d) firebase.auth().signOut();
  else if("recarregar" in d) location.reload();
  else if("desconectar" in d){
    if(!d.conf){ d.conf = "1"; t.textContent = "Clique de novo para desconectar"; return; }
    localStorage.removeItem(CFG_K);
    try { firebase.auth().signOut().finally(() => location.reload()); } catch(e){ location.reload(); }
  }
  else if("restaurar" in d) $("#arq-backup").click();
  else if(d.finserv) formFinServ(d.finserv);
  else if(d.novoLanc) formLanc(null, {tipo:d.novoLanc, sid:d.sid, voltar:d.sid});
  else if(d.lanc) formLanc(d.lanc, {voltar:d.voltar});
  else if(d.pagar){
    const f = S.func.find(x => x.id === d.pagar);
    formLanc(null, {tipo:"saida", fid:d.pagar, cat:CAT_SAI[0], valor:Number(d.valor), descricao:"Pagamento de " + nomeMes(S.mes) + (f ? " - " + f.nome : "")});
  }
  else if(d.foto) verFoto(d.foto, d.voltar, "soVer" in d);
  else if("tirarFoto" in d){ S.fotoForm = null; const a = $("#l-foto-area"); if(a) a.innerHTML = `<span class="meta">A foto será removida ao salvar.</span>`; const i = $("#l-foto"); if(i) i.value = ""; }
  else if(d.excluirLanc){
    if(!d.conf){ d.conf = "1"; t.textContent = "Clique de novo para excluir"; return; }
    const id = d.excluirLanc, l = S.lanc.find(x => x.id === id), v = t.closest("form").dataset.voltar;
    t.disabled = true;
    (async () => { if(l && l.temFoto) await S.db.doc("fotos/" + id).delete(); await S.db.doc("lancamentos/" + id).delete(); })()
      .then(() => { fechar(); aviso("Lançamento excluído."); if(v) setTimeout(() => formFinServ(v), 80); }).catch(erroForm);
  }
  else if(d.mes){ S.mes = somaMes(S.mes, Number(d.mes)); render(); }
  else if(d.filtro){ S.filtroServ = d.filtro; render(); }
  else if(d.dia){ S.presData = somaDia(S.presData, Number(d.dia)); ouvirPresenca(); render(); }
  else if(d.marca){
    if(S.marcas[d.id] === d.marca) delete S.marcas[d.id]; else S.marcas[d.id] = d.marca;
    S.presSujo = true; render(); gravarPresenca();
  }
});
document.addEventListener("input", ev => {
  if(ev.target.id === "busca"){ S.busca = ev.target.value; $("#lista").innerHTML = listaEquipe(); }
});
document.addEventListener("change", ev => {
  if(ev.target.id === "arq-backup" && ev.target.files[0]){
    ev.target.files[0].text().then(t => {
      const o = JSON.parse(t);
      if(!o || typeof o !== "object" || Array.isArray(o)) throw 0;
      backupPendente = o;
      abrir(`<form id="form-restaurar"><h2>Restaurar este backup?</h2>
        <p style="margin:0">${S.modo === "nuvem" ? "Os registros do arquivo serão gravados na nuvem, por cima dos que tiverem o mesmo código." : "Todos os dados atuais serão substituídos pelos do arquivo."}</p>
        <p class="err" id="erro" hidden></p>
        <div class="foot"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn primary" id="salvar">Restaurar</button></div></form>`);
    }).catch(() => aviso("Este arquivo não é um backup válido."));
    return;
  }
  if(ev.target.name === "dur") ev.target.closest("form").dataset.dur = ev.target.value;
  if(ev.target.name === "ltipo") ev.target.closest("form").dataset.tipo = ev.target.value;
  if(ev.target.id === "s-tipo") ev.target.closest("form").dataset.outro = ev.target.value === "Outro" ? "1" : "0";
  if(ev.target.id === "fin-mes" && ev.target.value){ S.mes = ev.target.value; render(); }
  if(ev.target.id === "l-foto" && ev.target.files[0]){
    const a = $("#l-foto-area"); if(a) a.innerHTML = `<span class="meta">Preparando a foto…</span>`;
    comprimirFoto(ev.target.files[0]).then(img => {
      S.fotoForm = img;
      const b = $("#l-foto-area"); if(b) b.innerHTML = `<img class="foto-prev" alt="Prévia do recibo" src="${img}"><div class="actions"><button type="button" class="btn small danger" data-tirar-foto>Remover foto</button></div>`;
    }).catch(() => { const b = $("#l-foto-area"); if(b) b.innerHTML = `<span class="meta">Não consegui abrir essa imagem. Tente outra foto.</span>`; });
  }
  if(ev.target.id === "pres-data" && ev.target.value){ S.presData = ev.target.value; ouvirPresenca(); render(); }
});
$("#dlg").addEventListener("close", () => { $("#dlg").innerHTML = ""; });

if(NO_APP){ try { new EventSource("/api/vivo"); } catch(e){} }
iniciar();
</script>
</body>
</html>
